name: hamtimer
description: "Hamtimer: tareas, Pomodoro, puntos, filtros con ML Kit y feed de fotos. Proyecto final de Desarrollo de Aplicaciones Móviles (ESEN)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  provider: ^6.1.5+1

  # API REST con Dio
  dio: ^5.11.1

  # Persistencia local
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  path: ^1.9.1

  # Firebase
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  firebase_analytics: ^13.0.1
  firebase_messaging: ^17.0.1

  # Cámara en vivo y ML Kit
  camera: ^0.12.2
  google_mlkit_face_detection: ^0.15.1

  intl: ^0.20.3
  connectivity_plus: ^7.3.2
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  permission_handler: 12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true